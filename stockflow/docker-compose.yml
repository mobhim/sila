# Local production-like stack: app + PostgreSQL. For real deployments use a managed database.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: stockflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U stockflow"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://stockflow:${POSTGRES_PASSWORD:-change-me}@db:5432/stockflow
    ports: ["3000:3000"]
    volumes: [uploads:/app/.uploads]
volumes:
  pgdata:
  uploads:
